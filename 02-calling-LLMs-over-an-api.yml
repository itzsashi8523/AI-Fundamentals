#choices[0].message.content:
-------------------------------
The reply always lives at `choices[0].message.content` - the first choice, its message, its content. `messages` is what you sent, and `usage` only reports token counts, not the answer.
First understand the structure: When you send a request to an LLM API, you are basically saying:

"Here is my question. Give me an answer."

The API sends back a JSON response containing several things.
API Response
│
├── choices
│   └── [0]
│       └── message
│           └── content  ← YOUR ACTUAL ANSWER
│
├── usage
│   ├── prompt_tokens
│   ├── completion_tokens
│   └── total_tokens
│
└── other information

So: choices[0].message.content.

What does [0] mean? This is very important. choices is an array/list of answers.

For example: here [1] means Answer 2
"choices": [
    {
        "message": {
            "content": "Answer 1"
        }
    },
    {
        "message": {
            "content": "Answer 2"
        }
    }
]

** `choices[0].message.content`: The reply always lives at `choices[0].message.content` - the first choice, its message, its content. `messages` is what you sent, and `usage` only reports token counts, not the answer.